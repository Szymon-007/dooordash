name: Release

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: "3.10"
            - run: python -m pip install -e ".[dev]" build
            - run: python -m ruff check
            - run: python -m pytest
            - run: python -m build --wheel
            - run: test -f "dist/dooordash-${GITHUB_REF_NAME#v}-py3-none-any.whl"
            - run: gh release create "$GITHUB_REF_NAME" dist/*.whl --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
